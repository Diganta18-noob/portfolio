<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>
  
  <!-- SEO Utama -->
  <title>Diganta Biswas | MERN Stack Developer</title>
  <meta name="description" content="Personal Portfolio of Diganta Biswas, MERN Stack Developer. Showcasing responsive web design, premium animations, and modern digital products." />
  <meta name="keywords" content="Diganta Biswas, Portfolio, MERN Stack Developer, Developer" />
  <meta name="author" content="Diganta Biswas" />

  <!-- Google Search Console -->


  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />
  <meta property="og:title" content="Diganta Biswas | MERN Stack Developer" />
  <meta property="og:description" content="Personal Portfolio of Diganta Biswas, MERN Stack Developer." />
  <meta property="og:image" content="/diganta-profile.jpg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="/" />
  <meta name="twitter:title" content="Diganta Biswas | MERN Stack Developer" />
  <meta name="twitter:description" content="Personal Portfolio of Diganta Biswas, MERN Stack Developer." />
  <meta name="twitter:image" content="/diganta-profile.jpg" />

  <!-- Canonical -->
  <link rel="canonical" href="/" />
</head>

<body>
  <!-- Konten teks penting untuk SEO -->
  <header style="display:none">
    <h1>Diganta Biswas</h1>
    <p>
      Personal Portfolio Showcase - MERN Stack Developer
    </p>
  </header>

  <!-- Root React -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
